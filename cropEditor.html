<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Sharpshooter — Crop</title>
        <link rel="stylesheet" href="cropEditor.css" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap"
        />
    </head>
    <body>
        <header class="topbar">
            <div class="brand">SHARPSHOOTER · CROP</div>
            <div class="readout" id="readout">— × — px</div>
            <div class="actions">
                <button type="button" id="reset" class="btn btn-ghost">Reset</button>
                <button type="button" id="cancel" class="btn btn-ghost">Cancel</button>
                <button type="button" id="confirm" class="btn btn-primary">Save crop</button>
            </div>
        </header>

        <main class="stage" id="stage">
            <div class="canvas-wrap" id="canvasWrap">
                <canvas id="image"></canvas>
                <div class="overlay" id="overlay">
                    <div class="crop-box" id="cropBox">
                        <div class="handle h-nw" data-handle="nw"></div>
                        <div class="handle h-n"  data-handle="n"></div>
                        <div class="handle h-ne" data-handle="ne"></div>
                        <div class="handle h-e"  data-handle="e"></div>
                        <div class="handle h-se" data-handle="se"></div>
                        <div class="handle h-s"  data-handle="s"></div>
                        <div class="handle h-sw" data-handle="sw"></div>
                        <div class="handle h-w"  data-handle="w"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="hint" id="hint">
            Drag inside the box to move. Drag a handle to resize. Scroll to zoom at the cursor. Middle-click + drag to pan. Esc to cancel.
        </footer>

        <script src="cropEditor.js"></script>
    </body>
</html>
